jobs:
  test-and-lint:
    docker:
      - image: cimg/python:3.10.1
      - image: cimg/postgres:14.1
        environment:
          POSTGRES_USER: postgres
          POSTGRES_DB: test_db
          POSTGRES_PASSWORD: postgres
      - image: redis:latest
    steps:
      - checkout # check out the code into the working directory
      - run:
          name: setup services credentials file
          command: echo "$GOOGLE_SERVICES_CREDENTIALS_FILE" > jaguar-services-credentials.json

      - run:
          name: setup services account file
          command: echo "$FIREBASE_SERVICE_ACCOUNT_KEY_FILE" > firebase-service-account-key.json

      - run:
          name: install dependencies
          command: pip install -r requirements.txt

      - run:
          name: run tests
          command: python manage.py test

      - store_test_results:
          path: test-reports

  deploy:
    docker:
      - image: cimg/python:3.10.1
    steps:
      - checkout
      - run:
          name: deploy to production
          command: |
            echo "**** Deploying to production ****"
            # Set up ssh key
            echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa_deploy_key
            chmod 600 ~/.ssh/id_rsa_deploy_key
            echo "Set up login credentials------ OK"
            # Set up login credentials
            server_ipaddress="$SERVER_IP"
            server_username="$SERVER_USERNAME"
            user_serverip="$SERVER_USERNAME@$SERVER_IP"
            # Connect to the server and pass deploy script for execution
            chmod 755 .circleci/deploy.sh
            ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa_deploy_key $user_serverip 'bash -s' $CIRCLE_BRANCH < .circleci/deploy.sh

workflows:
  version: 2
  test-deploy:
    jobs:
      - test-and-lint
      - deploy:
          requires:
            - test-and-lint
          filters:
            branches:
              only:
                - main
                - staging
                - dev
