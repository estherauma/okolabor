{% extends 'components/base.html' %}
{% block body %}

<div class="page-header">
    <div>
        <h1 class="page-title">User Logs</h1>
    </div>
</div>

<div class="row">
    <div class="col-md-12">
        <div class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="form-row align-items-center">
                        {% for field in form %}
                        <div class="col-auto">
                            <div class="form-group">
                                {{ field }}
                            </div>
                        </div>
                        {% endfor %}
                        <div class="col-auto">
                            <button type="submit" class="btn btn-primary mt-3">Submit</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-md-12">
        <div class="card">
            <div class="card-body">
                
                <div class="table-responsive">
                    <table class="table border text-nowrap text-md-nowrap table-striped mg-b-0">
                        <thead>
                            <tr>
                                <th>Timestamp</th>
                                <th>Action</th>
                                <th>Details</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for log in logs %}
                            <tr>
                                <td>{{log.created_at}}</td>
                                <td>{{log.action}}</td>
                                <td> Jan 24, 2024 </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div> 
    </div><!-- COL END --> 
</div>
{% endblock body %}
