{% extends 'components/base.html' %}
{% block body %}



<div class="page-header custom-page-header">
    <h1 class="page-title">User Logs</h1>
    <div class="search-bar">
        <div class="container">
          <form method="get">
            <div class="input-group search-input-group">
              <button class="btn search-btn" type="submit">
                <i class="fa fa-search"></i>
              </button>
              <input
                type="text"
                class="form-control search-input"
                name="query"
                placeholder="Search 'User Logs'"
                aria-label="Search"
              />
            </div>
          </form>
        </div>
    </div>
</div>

<div class="parent-btn-grp">
    <div class="dropdown-container">
      <div class="dropdown">
        <button
          class="btn dropdown-toggle dropdown-btn"
          type="button"
          id="dropdownMenuButton"
          data-bs-toggle="dropdown"
          aria-expanded="false"
        >
         Users
        </button>
  
        <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton">
          <li><a class="dropdown-item" href="#">Option 1</a></li>
          <li><a class="dropdown-item" href="#">Option 2</a></li>
          <li><a class="dropdown-item" href="#">Option 3</a></li>
        </ul>
      </div>
  
      <div class="dropdown">
        <button
          class="btn dropdown-toggle dropdown-btn"
          type="button"
          id="dropdownMenuButton"
          data-bs-toggle="dropdown"
          aria-expanded="false"
        >
          Days
        </button>
  
        <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton">
          <li><a class="dropdown-item" href="#">Option 1</a></li>
          <li><a class="dropdown-item" href="#">Option 2</a></li>
          <li><a class="dropdown-item" href="#">Option 3</a></li>
        </ul>
      </div>
  
      <div class="dropdown">
        <button
          class="btn dropdown-toggle dropdown-btn"
          type="button"
          id="dropdownMenuButton"
          data-bs-toggle="dropdown"
          aria-expanded="false"
        >
          Action Type
        </button>
  
        <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton">
          <li><a class="dropdown-item" href="#">Option 1</a></li>
          <li><a class="dropdown-item" href="#">Option 2</a></li>
          <li><a class="dropdown-item" href="#">Option 3</a></li>
        </ul>
      </div>
    </div>
  </div>

<div class="row">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">              
                <div class="table-responsive">
                  <table
                  id="basic-datatable"
                  class="table text-nowrap border-bottom"
              >
                  <thead>
                      <h3 class="card-title green-color fw-bold">Latest</h3>
                      <tr>
                          <th class="theading-color text-start">Timestamp</th>
                          <th class="theading-color text-start">Action</th>
                      </tr>
                  </thead>
                  <tbody>
                    {% for log in logs %}
                      <tr class="green-color text-start">
                        <td>{{log.created_at}}</td>
                        <td>{{log.action}}</td>
                      </tr>
                    {% endfor %}
                  </tbody>
              </table>
                </div>
            </div>
        </div> 
    </div><!-- COL END --> 
</div>
{% endblock body %}
