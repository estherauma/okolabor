{% load i18n %}
<div
  class="modal fade"
  id="inviteEmployeModal"
  tabindex="-1"
  aria-labelledby="inviteEmployeModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div
      class="modal-content modal-bg"
    >
      <div class="modal-header" style="background-color: #7DBF96;">
        <h5
          class="modal-title text-white"
          id="inviteEmployeModalLabel"
        >
        {% translate "employerAminListInviteUser"%}
        </h5>
      </div>
      <div class="modal-body text-start">
        <p class="mb-4 modal-subtitle-custom">
          {% translate "employerAminListThenAShortNotificationMessageGoesHereWithActionButtonsBelow" %}
        </p>
        <form method="POST">
          {% csrf_token %}
         

          <div class="mb-3">
            <label
              for="firstName"
              class="form-label modal-labels-custom"
              >{% translate "employerAminListFirstName"%}</label
            >
            <input
              type="text"
              class="form-control"
              id="firstName"
              name="first_name"
              required
            />
          </div>
          <div class="mb-3">
            <label
              for="lastName"
              class="form-label modal-labels-custom"
              >{% translate "employerAminListLastName"%}</label
            >
            <input
              type="text"
              class="form-control"
              id="lastName"
              name="last_name"
              required
            />
          </div>
          <div class="mb-3">
            <label
              for="email"
              class="form-label modal-labels-custom"
              >{% translate "employerAminListEmail"%}</label
            >
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              required
            />
          </div>
          <div class="mb-3">
            <label for="role" class="form-label modal-labels-custom">{% translate "employerAminListRole" %}</label>
            <select class="form-select" id="role" name="role" required>
              <option value="" disabled selected>{% translate "employerAminListSelectRole" %}</option>
              <option value="employer">{% translate "employerAminListEmployer" %}</option>
              <option value="employer_admin">{% translate "employerAminListAdmin" %}</option>
            </select>
          </div>
          
          <div class="d-flex justify-content-center gap-2 mt-4">
            <button
              type="button"
              class="btn"
              data-bs-dismiss="modal"
              style='background-color:#9A9898; color:white'
            >
            {% translate "employerAminListCancel"%}
            </button>
            <button
              type="submit"
              class="btn" 
              style='background-color:#7DBF96; color:white'
            >
            {% translate "employerAminListSendInvite"%}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
