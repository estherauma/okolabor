{% load static %}
{% load i18n %}
<div class="modal fade" id="editEmployerModal" tabindex="-1" aria-labelledby="editEmployerModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <form id="editEmployerForm" method="POST" data-base-action="/account/edit-employer/curp_placeholder/">


      {% csrf_token %}
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">{% translate "editEmployerEditEmployer" %}</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{% translate 'editEmployerClose'%}"></button>
        </div>

        <div class="modal-body">

          <div class="mb-3">
            <label for="edit_employer_first_name" class="form-label">{% translate "editEmployerFirstName" %}</label>
            <input type="text" class="form-control" id="edit_employer_first_name" name="first_name" required>
          </div>

          <div class="mb-3">
            <label for="edit_employer_last_name" class="form-label">{% translate "editEmployerLastName" %}</label>
            <input type="text" class="form-control" id="edit_employer_last_name" name="last_name" required>
          </div>

          <div class="mb-3">
            <label for="edit_employer_email" class="form-label">{% translate "editEmployerEmail" %}</label>
            <input type="email" class="form-control" id="edit_employer_email" name="email" readonly>
          </div>

          <div class="mb-3">
            <label for="edit_employer_language" class="form-label">{% translate "editEmployerLanguage" %}</label>
            <input type="text" class="form-control" id="edit_employer_language" name="language" required>
          </div>

          <div class="mb-3">
            <label for="edit_employer_is_active" class="form-label">{% translate "editEmployerIsActive" %}</label>
            <select class="form-select" id="edit_employer_is_active" name="is_active" required>
              <option value="True">{% translate "editEmployerActive" %}</option>
              <option value="False">{% translate "editEmployerInactive" %}</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="edit_employer_group" class="form-label">{% translate "editEmployerGroup" %}</label>
            <select class="form-select" id="edit_employer_group" name="group" required>
              <option value="employer">{% translate "editEmployerEmployer" %}</option>
              <option value="employer_admin">{% translate "editEmployerEmployerAdmin" %}</option>
            </select>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn grey-button" data-bs-dismiss="modal">{% translate "webCommonCancel" %}</button>
          <button type="submit" class="btn light-green-button">{% translate "webCommonSave" %}</button>
        </div>
      </div>
    </form>
  </div>
</div>

{% block scripts %}
  <script src="{% static 'assets/js/employer-edit-modal.js' %}"></script>
{% endblock scripts %}
