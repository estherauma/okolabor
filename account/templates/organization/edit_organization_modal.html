{% load static %}
{% load i18n %}
<div class="modal fade" id="editOrganizationModal" tabindex="-1" aria-labelledby="editOrganizationModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <form id="editOrganizationForm" method="POST" action="{% url 'edit_organization' organization_id='organization_id_placeholder' %}">
      {% csrf_token %}
      <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">{% translate "editOrganization" %}</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="edit_organization_name" class="form-label">{% translate "editOrganizationName" %}</label>
            <input type="text" class="form-control" id="edit_organization_name" name="name" required>
          </div>
          <div class="mb-3">
            <label for="edit_organization_email" class="form-label">{% translate "editOrganizationEmail" %}</label>
            <input type="email" class="form-control" id="edit_organization_email" name="email" readonly>
          </div>
          <div class="mb-3">
            <label for="edit_organization_phone" class="form-label">{% translate "editOrganizationPhone" %}</label>
            <input type="text" class="form-control" id="edit_organization_phone" name="phone" required>
          </div>
          <div class="mb-3">
            <label for="edit_organization_website" class="form-label">{% translate "editOrganizationWebsite" %}</label>
            <input type="url" class="form-control" id="edit_organization_website" name="website" required>
          </div>
          <div class="mb-3">
            <label for="edit_organization_address" class="form-label">{% translate "editOrganizationAddress" %}</label>
            <textarea class="form-control" id="edit_organization_address" name="address" required></textarea>
          </div>
          <div class="mb-3">
            <label for="edit_organization_city" class="form-label">{% translate "editOrganizationCity" %}</label>
            <input type="text" class="form-control" id="edit_organization_city" name="city" required>
          </div>
          <div class="mb-3">
            <label for="edit_organization_state" class="form-label">{% translate "editOrganizationState" %}</label>
            <input type="text" class="form-control" id="edit_organization_state" name="state" required>
          </div>
          <div class="mb-3">
            <label for="edit_organization_country" class="form-label">{% translate "editOrganizationCountry" %}</label>
            <input type="text" class="form-control" id="edit_organization_country" name="country" required>
          </div>
          <div class="mb-3">
            <label for="edit_organization_zip_code" class="form-label">{% translate "editOrganizationZipCode" %}</label>
            <input type="text" class="form-control" id="edit_organization_zip_code" name="zip_code" required>
          </div>
          <div class="mb-3">
            <label for="edit_organization_type" class="form-label">{% translate "editOrganizationType" %}</label>
            <input type="text" class="form-control" id="edit_organization_type" name="type" required>
          </div>
          <div class="mb-3">
            <label for="edit_organization_is_active" class="form-label">{% translate "editOrganizationIsActive" %}</label>
            <select class="form-select" id="edit_organization_is_active" name="is_active" required>
              <option value="True">{% translate "Active"%}</option>
              <option value="False">{% translate "inActive"%}</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">{% translate "Cancel"%}</button>
          <button type="submit" class="btn btn-success">{% translate "Save"%}</button>
        </div>
      </div>
    </form>
  </div>
</div>

{% block scripts %}
    <script src="{% static ''%}assets/js/organization-edit-model.js"></script>
{% endblock scripts %}
