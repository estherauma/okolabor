{% extends 'components/base.html' %} {% block body %}

<div class="page-header extra-margintop">
  <div>
    <h1 class="page-title">My Account</h1>
  </div>
</div>

<div class="row">
  <div class="col-lg-8 col-md-10 col-sm-12 col-xs-12 center-form">
    <div class="card">
      <div class="card-header">
        <h4 class="card-title">Update Password</h4>
      </div>
      <div class="card-body">
        <form method="post" class="mt-4">
          {% csrf_token %} {{ form.as_p }}
          <button type="submit" class="btn dark-green-button">
            Save Changes
          </button>
        </form>
      </div>
    </div>
  </div>
  <!-- COL END -->
</div>
{% endblock body %}
