{% extends 'components/base.html' %}
{% load i18n %}

{% block body %}

<div class="page-header">
 <div>
  <h1 class="page-title">
   {% translate "changePasswordMyAccount" %}
  </h1>
 </div>
</div>
<div class="row">
 <div class="col-md-6">
  <div class="card">
   <div class="card-header">
    <h4 class="card-title green-color">
     {% translate "changePasswordUpdatepassword" %}
    </h4>
   </div>
   <div class="card-body">
    <form class="mt-4" method="post">
     {% csrf_token %} {{ form.as_p }}
     <button class="btn dark-green-button" type="submit">
      {% translate "changePasswordSaveChanges" %}
     </button>
    </form>
   </div>
  </div>
 </div>
 <!-- COL END -->
</div>
{% endblock body %}
