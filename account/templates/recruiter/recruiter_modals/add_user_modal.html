{% load i18n %}
<div
  class="modal fade"
  id="inviteUserModal"
  tabindex="-1"
  aria-labelledby="inviteUserModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div
      class="modal-content modal-bg"
    >
      <div class="modal-header">
        <h5
          class="modal-title w-100"
          id="inviteUserModalLabel"
        >
        {% translate "recruiterAdminListInviteUser"%}
        </h5>
      </div>
      <div class="modal-body text-start">
        <p class="mb-4 modal-subtitle-custom">
          {% translate "recruiterAdminListThenAShortNotificationMessageGoesHereWithActionButtonsBelow" %}
        </p>
        <form method="POST">
          {% csrf_token %}

          <div class="mb-3">
            <label
              for="firstName"
              class="form-label modal-labels-custom"
              >{% translate "recruiterAdminListFirstName"%}</label
            >
            <input
              type="text"
              class="form-control"
              id="firstName"
              name="first_name"
              required
            />
          </div>
          <div class="mb-3">
            <label
              for="lastName"
              class="form-label modal-labels-custom"
              >{% translate "recruiterAdminListLastName"%}</label
            >
            <input
              type="text"
              class="form-control"
              id="lastName"
              name="last_name"
              required
            />
          </div>
          <div class="mb-3">
            <label
              for="email"
              class="form-label modal-labels-custom"
              >{% translate "recruiterAdminListEmail"%}</label
            >
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              required
            />
          </div>
          <div class="mb-3">
            <label for="role" class="form-label modal-labels-custom">{% translate "recruiterAdminListRole" %}</label>
            <select class="form-select" id="role" name="role" required>
              <option value="" disabled selected>{% translate "recruiterAdminListSelectRole" %}</option>
              <option value="recruiter">{% translate "recruiterAdminListRecruiter" %}</option>
              <option value="recruiter_admin">{% translate "recruiterAdminListRecruiterAdmin" %}</option>
            </select>
          </div>
          
          <div class="d-flex justify-content-center gap-2 mt-4">
            <button
              type="button"
              class="btn"
              data-bs-dismiss="modal"
              style='background-color:#9A9898; color:white'
            >
            {% translate "recruiterAdminListCancel"%}
            </button>
            <button
              type="submit"
              class="btn"
              style='background-color:#7DBF96; color:white'
            >
            {% translate "recruiterAdminListSendInvite"%}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
