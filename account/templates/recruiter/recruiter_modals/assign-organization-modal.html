{% load static %}
{% load i18n %}
<div class="modal fade" id="assignOrganizationModal" tabindex="-1" aria-labelledby="assignOrgLabel" aria-hidden="true">
    <div class="modal-dialog">
        <form id="assignOrganizationForm">
            {% csrf_token %}
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="assignOrgLabel">{% translate "recruiterAdminListAssignOrganization" %}</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{% translate 'recruiterAdminListOrgClose' %}"></button>
                </div>
                <div class="modal-body">
                    <select class="form-select" name="organization_id" required>
                        <option value="">{% translate "recruiterAdminListSelectOrganization" %}</option>
                        {% for org in recruiter_organizations %}
                            <option value="{{ org.id }}">{{ org.name }}</option>
                        {% endfor %}
                    </select>

                    <input type="hidden" name="selected_users" id="selectedUsersInput">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn grey-button" data-bs-dismiss="modal">
                        {% translate "webCommonCancel" %}
                    </button>
                    <button type="submit" class="btn light-green-button">{% translate "recruiterAdminListOrgAssign" %}</button>
                </div>
            </div>
        </form>
    </div>
</div>

{% block scripts %}
    <script src="{% static 'assets/js/assign-organization-modal.js' %}"></script>
{% endblock scripts %}
