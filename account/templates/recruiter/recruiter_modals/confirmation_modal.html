{% load i18n %}
<div
  class="modal fade"
  id="confirmationModal"
  tabindex="-1"
  aria-labelledby="confirmationModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div
      class="modal-content"
      style="border-radius: 8px"
    >
      <div class="modal-header" style="background-color: #7DBF96;">
        <h5
          class="modal-title text-white"
          id="confirmationModalLabel"
        >
           {% translate "manageUsersRecruitersAssignEmployer" %}
        </h5>
      </div>
      <div class="modal-body text-start">
        <p class="mb-4 modal-subtitle-custom text-center" >
           {% translate "manageUsersRecruitersDoYouWantToWorkWithNewEmployer" %}
        </p>
          <div class="d-flex justify-content-center gap-2 mt-4">
            <button
              type="button"
              class="btn"
              data-bs-dismiss="modal"
              style='background-color:#9A9898; color:white'
            >
               {% translate "manageUsersRecruitersNo" %}
            </button>
            <button
              type="submit"
              class="btn"
              style='background-color:#7DBF96; color:white'
            >
               {% translate "manageUsersRecruitersYes" %}
            </button>
          </div>
      </div>
    </div>
  </div>
</div>
