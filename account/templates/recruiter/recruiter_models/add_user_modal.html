{% load i18n %}
<div
  class="modal fade"
  id="inviteUserModal"
  tabindex="-1"
  aria-labelledby="inviteUserModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div
      class="modal-content modal-bg"
    >
      <div class="modal-header border-0">
        <h5
          class="modal-title w-100 text-center fw-bold modal-title-custom"
          id="inviteUserModalLabel"
        >
        {% translate "addUserInviteUser"%}
        </h5>
      </div>
      <div class="modal-body text-start">
        <p class="mb-4 modal-subtitle-custom">
          {% translate "addUserThenAShortNotificationMessageGoesHereWithActionButtonsBelow." %}
        </p>
        <form method="POST">
          {% csrf_token %}
          <div class="mb-3">
            <label for="curp" class="form-label modal-labels-custom">{% translate "addUserCURP"%}</label>
            <input
              type="text"
              class="form-control"
              id="curp"
              name="curp"
              required
            />
          </div>

          <div class="mb-3">
            <label
              for="firstName"
              class="form-label modal-labels-custom"
              >{% translate "addUserFirstName"%}</label
            >
            <input
              type="text"
              class="form-control"
              id="firstName"
              name="first_name"
              required
            />
          </div>
          <div class="mb-3">
            <label
              for="lastName"
              class="form-label modal-labels-custom"
              >{% translate "addUserLastName"%}</label
            >
            <input
              type="text"
              class="form-control"
              id="lastName"
              name="last_name"
              required
            />
          </div>
          <div class="mb-3">
            <label
              for="email"
              class="form-label modal-labels-custom"
              >{% translate "addUserEmail"%}</label
            >
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              required
            />
          </div>
          <div class="mb-3">
            <label
              for="role"
              class="form-label modal-labels-custom"
              >{% translate "addUserRole"%}</label
            >
            <select class="form-select" id="role" name="role" required>
              <option value="" disabled selected>{% translate "addUserSelectRole"%}</option>
              <option value="recruiter">{% translate "addUserRecruiter"%}</option>
            </select>
          </div>
          <div class="d-flex justify-content-center gap-2 mt-4">
            <button
              type="button"
              class="btn grey-button modal-buttons-custom"
              data-bs-dismiss="modal"
            >
            {% translate "addUserCancel"%}
            </button>
            <button
              type="submit"
              class="btn light-green-button modal-buttons-custom"
            >
            {% translate "addUserSendInvite"%}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
