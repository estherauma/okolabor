{% load i18n %}
<div
  class="modal fade"
  id="AddWorkerModal"
  tabindex="-1"
  aria-labelledby="AddWorkerModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content modal-bg">
      <div class="modal-header">
        <div>
          <h5 class="modal-title" id="AddWorkerModalLabel">
            {% translate "addWorkerInviteAddWorker" %}
          </h5>
        </div>
      </div>
      <div class="modal-body text-start">
        <form method="post" action="{% url 'worker_modal_create' %}">
          {% csrf_token %}
          {% for field in form_worker_class %}
          <div class="form-group my-3">
            <label>{{ field.label }}</label>
            <div class="input-group input-group-outline is_valid my-3">
              {{ field }}
            </div>
          </div>
          {% endfor %}
          <div class="d-flex justify-content-center gap-2 mt-4">
            <button type="button" class="btn grey-button me-2" data-bs-dismiss="modal">
              {% translate "webCommonCancel" %}
            </button>
            <button type="submit" class="btn light-green-button" data-bs-dismiss="modal">
              {% translate "addWorkerInviteSubmit" %}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
