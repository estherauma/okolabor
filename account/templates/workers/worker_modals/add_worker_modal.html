{% load i18n %}
<div
  class="modal fade"
  id="AddWorkerModal"
  tabindex="-1"
  aria-labelledby="AddWorkerModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content modal-bg">
      <div class="modal-header border-0">
        <div>
          <h5 class="modal-title w-100 text-center fw-bold modal-title-custom" id="AddWorkerModalLabel">
            {% translate "createWorkerAddWorker" %}
          </h5>
        </div>
      </div>
      <div class="modal-body text-start">
        <form method="post" action="{% url 'worker_modal_create' %}">
          {% csrf_token %}
          {% for field in form_worker_class %}
          <div class="form-group my-3">
            <label>{{ field.label }}</label>
            <div class="input-group input-group-outline is_valid my-3">
              {{ field }}
            </div>
          </div>
          {% endfor %}
          <button class="btn btn-primary" type="submit">
            {% translate "submit" %}
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
