{% load i18n %}
<div
  class="modal fade"
  id="confirmationModal"
  tabindex="-1"
  aria-labelledby="confirmationModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div
      class="modal-content"
      style="border-radius: 8px"
    >
      <div class="modal-header">
        <h5
          class="modal-title"
          id="confirmationModalLabel"
        >
          {% translate 'manageUsersWorkersAssignEmployer' %}
        </h5>
      </div>
      <div class="modal-body text-start">
        <p class="mb-4 modal-subtitle-custom text-center" >
           {% translate 'manageUsersWorkersDoYouWantToWorkWithNewEmployer' %}
        </p>
          <div class="d-flex justify-content-center gap-2 mt-4">
            <button
              type="button"
              class="btn grey-button"
              data-bs-dismiss="modal"
            >
               {% translate 'manageUsersWorkersNo'%}
            </button>
            <button
              type="submit"
              class="btn light-green-button"
            >
              {% translate 'manageUsersWorkersYes'%}
            </button>
          </div>
      </div>
    </div>
  </div>
</div>
