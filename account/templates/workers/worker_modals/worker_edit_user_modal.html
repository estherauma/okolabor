{% load static %}
{% load i18n %}
{% load i18n %}
<div class="modal fade" id="editWorkerModal" tabindex="-1" aria-labelledby="editWorkerModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header" style="background-color: #7DBF96;">
        <h5 class="modal-title text-white" id="editWorkerModalLabel">{% translate "editWorkerEditWorker" %}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{% translate 'editWorkerClose'%}"></button>
      </div>
      <div class="modal-body">
        <form id="editWorkerForm" method="POST" action="{% url 'edit_worker' curp='curp_placeholder' %}">
          {% csrf_token %}
          <div class="mb-3">
            <label for="edit_first_name" class="form-label modal-labels-custom">{% translate "editWorkerFirstName" %}</label>
            <input type="text" class="form-control" id="edit_first_name" name="first_name" readonly />
          </div>
          <div class="mb-3">
            <label for="edit_last_name" class="form-label modal-labels-custom">{% translate "editWorkerLastName" %}</label>
            <input type="text" class="form-control" id="edit_last_name" name="last_name" readonly />
          </div>
          <div class="mb-3">
            <label for="edit_email" class="form-label modal-labels-custom">{% translate "editWorkerEmail" %}</label>
            <input type="email" class="form-control" id="edit_email" name="email" readonly />
          </div>
          <div class="mb-3">
            <label for="edit_is_active" class="form-label modal-labels-custom">{% translate "editWorkerIsActive" %}</label>
            <select class="form-select" id="edit_is_active" name="is_active" required>
                {% for value, label in status_choices %}
                    <option value="{{ value }}">{{ label }}</option>
                {% endfor %}
            </select>
          </div>
          <div class="d-flex justify-content-center gap-2 mt-4">
            <button type="button" class="btn" data-bs-dismiss="modal" style='background-color:#9A9898; color:white'>
              {% translate "editWorkerCancel" %}
            </button>
            <button type="submit" class="btn" style='background-color:#7DBF96; color:white'>
              {% translate "editWorkerSave" %}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% block scripts %}

  <script src="{% static ''%}assets/js/worker-edit-modal.js"></script>

{% endblock scripts %}
