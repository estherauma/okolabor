{% load static %}
{% load i18n %}
{% load i18n %}
<div class="modal fade" id="editWorkerModal" tabindex="-1" aria-labelledby="editWorkerModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="editWorkerModalLabel">{% translate "editWorkerEditUser" %}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="editWorkerForm" method="POST" action="{% url 'edit_worker' curp='curp_placeholder' %}">
          {% csrf_token %}
          <div class="mb-3">
            <label for="edit_curp" class="form-label modal-labels-custom">{% translate "editUserCURP" %}</label>
            <input type="text" class="form-control" id="edit_curp" name="curp" readonly />
          </div>
          <div class="mb-3">
            <label for="edit_first_name" class="form-label modal-labels-custom">{% translate "editUserFirstName" %}</label>
            <input type="text" class="form-control" id="edit_first_name" name="first_name" readonly />
          </div>
          <div class="mb-3">
            <label for="edit_last_name" class="form-label modal-labels-custom">{% translate "editUserLastName" %}</label>
            <input type="text" class="form-control" id="edit_last_name" name="last_name" readonly />
          </div>
          <div class="mb-3">
            <label for="edit_email" class="form-label modal-labels-custom">{% translate "editUserEmail" %}</label>
            <input type="email" class="form-control" id="edit_email" name="email" readonly />
          </div>
          <div class="mb-3">
            <label for="edit_is_active" class="form-label modal-labels-custom">{% translate "editUserIsActive" %}</label>
            <select class="form-select" id="edit_is_active" name="is_active" required>
                {% for value, label in status_choices %}
                    <option value="{{ value }}">{{ label }}</option>
                {% endfor %}
            </select>
          </div>
          <div class="d-flex justify-content-center gap-2 mt-4">
            <button type="button" class="btn grey-button modal-buttons-custom" data-bs-dismiss="modal">
              {% translate "editUserCancel" %}
            </button>
            <button type="submit" class="btn light-green-button modal-buttons-custom">
              {% translate "editUserSave" %}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% block scripts %}

  <script src="{% static ''%}assets/js/worker-edit-model.js"></script>

{% endblock scripts %}
