{% extends 'components/base.html' %}
{% load i18n %}
{% block title %} Message Details {% endblock title %}

{% block body %}
<div class="message-card" style="">
 <div class="card-header" style="font-size: 1.25rem; font-weight: bold; background-color: #f8f9fa; padding: 10px;">
  {{ message.subject }}
 </div>
 <br/>
 <div>
  <p>
   <strong>
    {% translate "Body:" %}
   </strong>
   {{ message.body }}
  </p>
  <p>
   <strong>
    {% translate "Sent at:" %}
   </strong>
   {{ message.created_at}}
  </p>
  <a class="btn gray-color fs-5 reply-icon" href="#" title="Reply">
   ↩
  </a>
  <a class="btn btn-primary" href="{% url 'recruiting_web:recruiter_messages' %}">
   {% translate "Back" %}
  </a>
 </div>
</div>
{% endblock %}
