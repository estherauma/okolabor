{% extends 'components/base.html' %}

{% block title %} My Messages {% endblock title %}

{% block body %}

<div class="page-header">
    <div>
        <h1 class="page-title">My Messages</h1>
    </div>
</div>

<div class="row">
    <div class="col-md-12">
        <div class="card offwhite-color">
            <div class="card-body">
                <div class="d-flex justify-content-between">
                    <form method="post">
                        {% csrf_token %}
                        <div class="form-row d-flex align-items-center">
                            {% for field in form %}
                            <div class="col-auto">
                                <div class="form-group">
                                    {{ field }}
                                </div>
                            </div>
                            {% endfor %}
                            <div class="col-auto">
                                <button type="submit" class="form-group btn light light-green-button">Filter</button>
                            </div>
                        </div>
                    </form>

                    <div>
                        <a href="{% url 'recruiting_web:recruiter_create_message' %}" class="btn dark-green-button">
                            <span>
                                <i class="fe fe-plus"></i>
                            </span> New Message
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-md-12">
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table text-nowrap border-bottom">
                        <tbody>
                            {% for item in items %}
                            <tr>
                                <td class="green-color align-middle">{{ item.created_at }}</td>
                                <td class="green-color align-middle">
                                    <a class="text-decoration-underline text-primary fw-bold" title="Details" href="{% url 'recruiting_web:message-details' item.id %}">
                                        {{ item.subject }}
                                    </a>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>                     
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
