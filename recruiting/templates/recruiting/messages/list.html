{% extends 'components/base.html' %}

{% block title %} My Messages {% endblock title %}

{% block body %}

<div class="page-header">
    <div>
        <h1 class="page-title">My Messages</h1>
    </div>
</div>

<div class="row">
    <div class="col-md-12">
        <div class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="form-row align-items-center">
                        {% for field in form %}
                        <div class="col-auto">
                            <div class="form-group">
                                {{ field }}
                            </div>
                        </div>
                        {% endfor %}
                        <div class="col-auto">
                            <button type="submit" class="btn btn-primary mt-3">Filter</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
