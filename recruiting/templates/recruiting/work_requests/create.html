{% load i18n %}
<div class="modal fade" id="jobOrderModal" tabindex="-1" aria-labelledby="jobOrderModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="jobOrderModalLabel">{% translate "createJobOrderCreateJoborder" %}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{% translate 'webCommonClose' %}"></button>
      </div>
      <div class="modal-body">
        <form method="post" action="{% url 'recruiting_web:workrequest_create' %}">
          {% csrf_token %}
          {% for field in form %}
            <div class="col">
              <div class="form-group my-3">
                <label>{{ field.label }}</label>
                <div class="input-group input-group-outline is_valid my-3">
                  {{ field }}
                </div>
              </div>
            </div>
          {% endfor %}
          <button class="btn dark-green-button" type="submit">
            {% translate "createJobOrderSubmit" %}
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
