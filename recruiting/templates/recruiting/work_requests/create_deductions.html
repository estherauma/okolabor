{% extends 'components/base.html' %}


{% block title %} Role Deduction {% endblock title %}

{% block body %}
<div class="page-header">
    <div>
        <h1 class="page-title">Add Role deductions</h1>
    </div>
</div>

<div class="row">
    <div class="col-md-9 col-xs-12">
        <div class="card my-4 mb-4 offwhite-background">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="col">
                        <div class="form-group my-3">
                            <label>{{field.label}}</label>
                            <div class="input-group input-group-outline is_valid my-3">
                                {{ field }}
                            </div>
                        </div>
                    </div>

                    {% endfor %}
                    <button type="submit" class="btn dark-green-button">Submit</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
