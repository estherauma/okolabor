{% load i18n %}

<div class="modal fade" id="HousingModal{{ role.id }}" tabindex="-1" aria-labelledby="HousingModalLabel{{ role.id }}" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      
      <div class="modal-header">
        <h5 class="modal-title" id="HousingModalLabel{{ role.id }}">{% translate "joDetailsHousingInfoAddHousing" %}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body">
        <form method="post" id="HousingForm" action="{% url 'recruiting_web:workrequest_housing_create' role.id %}">
          {% csrf_token %}
         
          <div class="col">
            <div class="form-group my-3">
              <label>{% translate "roleHousingRole" %}</label>
              <div class="input-group input-group-outline is_valid my-3">
                <input type="text" class="form-control" value="{{ role }}" disabled>
              </div>
            </div>
          </div>

          
          <input type="hidden" name="role" value="{{ role.id }}">

          {% for field in role_Housing_form %}
            {% if field.name != 'role' %}
              <div class="col">
                <div class="form-group my-3">
                  <label>{{ field.label }}</label>
                  <div class="input-group input-group-outline is_valid my-3">
                    {{ field }}
                  </div>
                  {% for error in field.errors %}
                    <div class="text-danger small">{{ error }}</div>
                  {% endfor %}
                </div>
              </div>
            {% endif %}
          {% endfor %}

          <button class="btn dark-green-button" type="submit">
            {% translate "roleHousingSubmit" %}
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
