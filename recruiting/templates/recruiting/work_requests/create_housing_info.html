{% load i18n %}

<div class="modal fade" id="HousingModal{{ role.id }}" tabindex="-1" aria-labelledby="HousingModalLabel{{ role.id }}" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      
      <div class="modal-header">
        <h5 class="modal-title" id="HousingModalLabel{{ role.id }}">{% translate "joDetailsHousingInfoAddHousing" %}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body">
        <form method="post" id="HousingForm" action="{% url 'recruiting_web:workrequest_housing_create' role.id %}">
          {% csrf_token %}
         
          <div class="mb-3">
            <div class="form-group mb-2">
              <label>{% translate "roleHousingRole" %}</label>
              <div class="input-group input-group-outline is_valid mt-1">
                <input type="text" class="form-control" value="{{ role }}" disabled>
              </div>
            </div>
          </div>

          <input type="hidden" name="role" value="{{ role.id }}">

          {% for field in role_Housing_form %}
            {% if field.name != 'role' %}
              <div class="mb-3">
                <div class="form-group mb-1">
                  <label class="form-label mb-1">{{ field.label }}</label>
                  <div class="input-group input-group-outline is_valid mt-1">
                    {{ field }}
                  </div>
                  {% for error in field.errors %}
                    <div class="text-danger small mt-1">{{ error }}</div>
                  {% endfor %}
                </div>
              </div>
            {% endif %}
          {% endfor %}
      
          <div class="modal-footer">
            <button type="button" class="btn grey-button" data-bs-dismiss="modal">
              {% translate 'webCommonCancel' %}
            </button>
            <button type="submit" class="btn dark-green-button">
              {% translate "roleHousingSubmit" %}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
