{% load i18n %}

<div class="modal fade" id="wagesModal{{ role.id }}" tabindex="-1" aria-labelledby="wagesModalLabel{{ role.id }}" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      
      <div class="modal-header">
        <h5 class="modal-title" id="wagesModalLabel{{ role.id }}">{% translate "Add Wages" %}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <!-- Modal Body -->
      <div class="modal-body">
        <form method="post" id="wagesForm" action="{% url 'recruiting_web:workrequest_wages_create' role.id %}">
          {% csrf_token %}
         
          <div class="mb-3">
            <div class="form-group mb-2">
              <label>{% translate "roleWagesRole" %}</label>
              <div class="input-group input-group-outline is_valid mt-1">
                <input type="text" class="form-control" value="{{ role }}" disabled>
              </div>
            </div>
          </div>

          <!-- Hidden field to actually submit role ID -->
          <input type="hidden" name="role" value="{{ role.id }}">

          <!-- Render all other fields except 'role' -->
          {% for field in role_Wages_form %}
            {% if field.name != 'role' %}
              <div class="mb-3">
                <div class="form-group mb-1">
                  <label class="form-label fw-semibold mb-1">{{ field.label }}</label>
                  <div class="input-group input-group-outline is_valid mt-1">
                    {{ field }}
                  </div>
                  {% for error in field.errors %}
                    <div class="text-danger small mt-1">{{ error }}</div>
                  {% endfor %}
                </div>
              </div>
            {% endif %}
          {% endfor %}

          <!-- Submit button -->
          <button class="btn dark-green-button" type="submit">
            {% translate "roleWagesSubmit" %}
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
