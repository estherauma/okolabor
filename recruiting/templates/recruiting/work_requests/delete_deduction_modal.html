{% load i18n %}
{% load static %}
{% load custom_filters %}
<div class="modal fade" id="deleteDeductionModal{{ deduction.id }}" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form method="POST" action="{% url 'recruiting_web:delete_deduction' deduction.id %}">
          {% csrf_token %}
          <div class="modal-header">
            <h5 class="modal-title">{% translate "Confirm Delete" %}</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <p>{% translate "Are you sure you want to delete this deduction?" %}</p>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-danger">{% translate "Delete" %}</button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">{% translate "Cancel" %}</button>
          </div>
        </form>
      </div>
    </div>
  </div>
