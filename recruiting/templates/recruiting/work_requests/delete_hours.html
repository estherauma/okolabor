{% load i18n %}
{% load static %}
{% load custom_filters %}
<div class="modal fade" id="deletehoursModal{{ role.id }}" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form method="POST" >
          {% csrf_token %}
          <div class="modal-header">
            <h5 class="modal-title">{% translate 'joDetailsHoursDeleteHours' %}</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <p>
              {% translate 'joDetailsHoursAreYouSureYouWantToDeleteThisEntry'%}
            </p>
          </div>   
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">{% translate 'joDetailsHoursDeleteCancel' %}</button>
            <button type="submit" class="btn btn-danger">{% translate 'joDetailsHoursDelete' %}</button>
          </div>
        </form>
      </div>
    </div>
  </div>
