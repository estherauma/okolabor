{% load i18n %}
{% load static %}
{% load custom_filters %}
<div class="modal fade" id="deleteHousingInformationModal{{ role.id }}" tabindex="-1" aria-labelledby="deleteEmploymentInformationLabel{{ role.id }}" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form method="POST" action="{% url 'recruiting_web:housing_information_delete' role.housing_information.id %}">
        {% csrf_token %}
        <input type="hidden" name="work_request_id" value="{{ workrequest.id }}">

        <div class="modal-header" style="background-color: #7DBF96;">
          <h5 class="modal-title text-white" id="deleteHousingInformationLabel{{ role.id }}">
            {% translate "joDetailsHousingInfoConfirmDelete" %}
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="{% translate 'joDetailsHousingInfoDeleteClose'%}"></button>
        </div>

        <div class="modal-body">
          <p>{% translate "joDetailsHousingInfoAreYouSureYouWantToDeleteTheEmploymentHousingForThisRole" %}</p>
          <strong>{{ role.name }}</strong>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">{% translate 'joDetailsHousingInfoDeleteCancel' %}</button>
          <button type="submit" class="btn btn-danger">{% translate 'joDetailsHousingInfoDelete' %}</button>
        </div>
      </form>
    </div>
  </div>
</div>
