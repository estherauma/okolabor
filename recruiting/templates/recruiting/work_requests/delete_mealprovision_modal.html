{% load i18n %}
{% load static %}
{% load custom_filters %}
<div class="modal fade" id="deleteMealProvisionModal{{ role.id }}" tabindex="-1" aria-labelledby="deleteEmploymentInformationLabel{{ role.id }}" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form method="POST" action="{% url 'recruiting_web:meal_provision_delete' role.employment_location.id %}">
        {% csrf_token %}
        <input type="hidden" name="work_request_id" value="{{ workrequest.id }}">

        <div class="modal-header" style="background-color: #7DBF96;">
          <h5 class="modal-title text-white" id="deleteMealProvisionLabel{{ role.id }}">
            {% translate "roleMealProvisionConfirmDeletion" %}
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="{% translate 'roleMealProvisionDeleteClose'%}"></button>
        </div>

        <div class="modal-body">
          <p>{% translate "roleMealProvisionAreYouSureYouWantToDeleteMealProvisionInfoForThisRole" %}</p>
          <strong>{{ role.name }}</strong>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn" data-bs-dismiss="modal" style='background-color:#9A9898; color:white'>{% translate 'roleMealProvisionDeleteCancel' %}</button>
          <button type="submit" class="btn" style='background-color:#F95406; color:white'>{% translate 'roleMealProvisionDelete' %}</button>
        </div>
      </form>
    </div>
  </div>
</div>
