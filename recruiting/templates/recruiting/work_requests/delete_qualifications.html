{% load i18n %}
{% load static %}
{% load custom_filters %}<div class="modal fade" id="deleteQualificationModal{{ role.id }}" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog">
      <div class="modal-content">
  
        <div class="modal-header" style="background-color: #7DBF96;">
          <h5 class="modal-title text-white">Confirm Delete</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
  
        <div class="modal-body">
          Are you sure you want to delete the qualification for role <strong>{{ role.title }}</strong>?
        </div>
  
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>

          {% if role.qualifications and role.qualifications.pk %}
          <form method="POST" action="{% url 'recruiting_web:delete-role-qualification' role.qualifications.pk %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Delete</button>
          </form>
          {% else %}
          <p class="text-muted">No qualifications to delete.</p>
          {% endif %}
        </div>
  
      </div>
    </div>
  </div>
