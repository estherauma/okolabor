{% load i18n %}
{% load custom_filters %}

<div class="modal fade" id="addWorkerModal" tabindex="-1" aria-labelledby="addWorkerModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      
      <div class="modal-header">
        <h5 class="modal-title" id="addWorkerModalLabel">{% translate "workersListAddWorker" %}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <!-- Modal Body -->
      <div class="modal-body">
    <form method="post" id="addWorkerForm" action="{% url 'recruiting_web:recruiter_create_worker' %}">
     {% csrf_token %}
    {% for field in worker_form %}
     <div class="col">
      <div class="form-group my-3">
       <label>
        {{field.label}}
       </label>
       <div class="input-group input-group-outline is_valid my-3">
        {{ field }}
       </div>
      </div>
     </div>
     {% endfor %}
     <button class="btn light-green-button" type="submit">
      {% translate "addWorkerSubmit" %}
     </button>
    </form>
   </div>
  </div>
 </div>
</div>
