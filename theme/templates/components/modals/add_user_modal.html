<div
  class="modal fade"
  id="inviteUserModal"
  tabindex="-1"
  aria-labelledby="inviteUserModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div
      class="modal-content"
      style="background-color: #fdfde2; border-radius: 8px"
    >
      <div class="modal-header border-0">
        <h5
          class="modal-title w-100 text-center fw-bold"
          id="inviteUserModalLabel"
          style="font-size: 1.25rem; color: #000"
        >
          Invite User
        </h5>
      </div>
      <div class="modal-body text-start">
        <p class="mb-4" style="color: #555; font-size: 0.9rem">
          Then a short notification message goes here with action buttons below.
        </p>
        <form method="POST">
          {% csrf_token %}
          <div class="mb-3">
            <label
              for="firstName"
              class="form-label"
              style="font-size: 0.85rem; color: #9a9898"
              >First Name</label
            >
            <input
              type="text"
              class="form-control"
              id="firstName"
              name="first_name"
              required
            />
          </div>
          <div class="mb-3">
            <label
              for="lastName"
              class="form-label"
              style="font-size: 0.85rem; color: #9a9898"
              >Last Name</label
            >
            <input
              type="text"
              class="form-control"
              id="lastName"
              name="last_name"
              required
            />
          </div>
          <div class="mb-3">
            <label
              for="email"
              class="form-label"
              style="font-size: 0.85rem; color: #9a9898"
              >Email</label
            >
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              required
            />
          </div>
          <div class="mb-3">
            <label
              for="role"
              class="form-label"
              style="font-size: 0.85rem; color: #9a9898"
              >Role</label
            >
            <select class="form-select" id="role" name="role" required>
              <option value="" disabled selected>Select Role</option>
              <option value="admin">Admin</option>
              <option value="editor">Editor</option>
              <option value="viewer">Viewer</option>
            </select>
          </div>
          <div class="d-flex justify-content-center gap-2 mt-4">
            <button
              type="button"
              class="btn grey-button"
              data-bs-dismiss="modal"
              style="border-radius: 24px; padding: 0.5rem 1.5rem"
            >
              Cancel
            </button>
            <button
              type="submit"
              class="btn light-green-button"
              style="border-radius: 24px; padding: 0.5rem 1.5rem"
            >
              Send Invite
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
