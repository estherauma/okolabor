<div
  class="modal fade"
  id="confirmationModal"
  tabindex="-1"
  aria-labelledby="confirmationModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div
      class="modal-content"
      style="border-radius: 8px"
    >
      <div class="modal-header border-0">
        <h5
          class="modal-title w-100 text-center fw-bold"
          id="confirmationModalLabel"
          style="font-size: 1.25rem; color: #000"
        >
          Assign Employer
        </h5>
      </div>
      <div class="modal-body text-start">
        <p class="mb-4" style="color: #555; font-size: 0.9rem; text-align: center;">
          Do you want to work with New Employer 1
        </p>
          <div class="d-flex justify-content-center gap-2 mt-4">
            <button
              type="button"
              class="btn grey-button"
              data-bs-dismiss="modal"
              style="border-radius: 24px; padding: 0.5rem 1.5rem"
            >
              No
            </button>
            <button
              type="submit"
              class="btn light-green-button"
              style="border-radius: 24px; padding: 0.5rem 1.5rem"
            >
              Yes
            </button>
          </div>
      </div>
    </div>
  </div>
</div>
