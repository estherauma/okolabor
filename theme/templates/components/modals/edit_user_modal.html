<div
  class="modal fade"
  id="editUserModal"
  tabindex="-1"
  aria-labelledby="editUserModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div
      class="modal-content modal-bg"
    >
      <div class="modal-header border-0">
        <h5
          class="modal-title w-100 text-center fw-bold modal-title-custom"
          id="editUserModalLabel"
        >
          Edit User
        </h5>
      </div>
      <div class="modal-body text-start">
        <p class="mb-4 modal-subtitle-custom">
          Then a short notification message goes here with action buttons below.
        </p>
        <form method="POST">
          {% csrf_token %}
          <div class="mb-3">
            <label
              for="firstName"
              class="form-label modal-labels-custom"
              >First Name</label
            >
            <input
              type="text"
              class="form-control"
              id="firstName"
              name="first_name"
              required
            />
          </div>
          <div class="mb-3">
            <label
              for="lastName"
              class="form-label modal-labels-custom"
              >Last Name</label
            >
            <input
              type="text"
              class="form-control"
              id="lastName"
              name="last_name"
              required
            />
          </div>
          <div class="mb-3">
            <label
              for="email"
              class="form-label modal-labels-custom"
              >Email</label
            >
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              required
            />
          </div>
          <div class="mb-3">
            <label
              for="role"
              class="form-label modal-labels-custom"
              >Role</label
            >
            <select class="form-select" id="role" name="role" required>
              <option value="" disabled selected>Select Role</option>
              <option value="admin">Admin</option>
              <option value="editor">Editor</option>
              <option value="viewer">Viewer</option>
            </select>
          </div>
          <div class="d-flex justify-content-center gap-2 mt-4">
            <button
              type="button"
              class="btn grey-button modal-buttons-custom"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button
              type="submit"
              class="btn light-green-button modal-buttons-custom"
            >
              Send Invite
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
