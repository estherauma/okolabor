<!-- Modal for Editing User -->
<div class="modal fade" id="editUserModal" tabindex="-1" aria-labelledby="editUserModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="editUserModalLabel">Edit User</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        
        <form id="editUserForm" method="POST" action="{% url 'edit_user' curp='curp_placeholder' %}">
            {% csrf_token %}
            <div class="mb-3">
              <label for="curp" class="form-label modal-labels-custom">CURP</label>
              <input type="text" class="form-control" id="edit_curp" name="curp" readonly />
            </div>
            
            <div class="mb-3">
              <label for="first_name" class="form-label modal-labels-custom">First Name</label>
              <input type="text" class="form-control" id="edit_first_name" name="first_name" required />
            </div>
            
            <div class="mb-3">
              <label for="last_name" class="form-label modal-labels-custom">Last Name</label>
              <input type="text" class="form-control" id="edit_last_name" name="last_name" required />
            </div>
            
            <div class="mb-3">
              <label for="email" class="form-label modal-labels-custom">Email</label>
              <input type="email" class="form-control" id="edit_email" name="email" readonly />
            </div>
                        <div class="mb-3">
              <label
                for="role"
                class="form-label modal-labels-custom"
                >Role</label
              >
              <select class="form-select" id="role" name="role" required>
                <option value="" disabled selected>Select Role</option>
                <option value="admin">Recruiter</option>
              </select>
            </div>
            <div class="d-flex justify-content-center gap-2 mt-4">
              <button
                type="button"
                class="btn grey-button modal-buttons-custom"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
              <button
                type="submit"
                class="btn light-green-button modal-buttons-custom"
              >
                Save
              </button>
            </div>
          </form>
      
      </div>
    </div>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const editButtons = document.querySelectorAll(".edit-user-btn");

    editButtons.forEach(function (button) {
        button.addEventListener("click", function () {
            const curp = this.getAttribute("data-curp");
            const firstName = this.getAttribute("data-first-name");
            const lastName = this.getAttribute("data-last-name");
            const email = this.getAttribute("data-email");

            document.getElementById("edit_curp").value = curp || "";
            document.getElementById("edit_first_name").value = firstName || "";
            document.getElementById("edit_last_name").value = lastName || "";
            document.getElementById("edit_email").value = email || "";

            const form = document.getElementById("editUserForm");
            if (form) {
                form.action = form.action.replace("curp_placeholder", curp);
            }
        });
    });

    document.getElementById("editUserForm").addEventListener("submit", function (event) {
        event.preventDefault(); 

        const formData = new FormData(this);

        fetch(this.action, {
            method: "POST",
            body: formData,
            headers: {
                "X-Requested-With": "XMLHttpRequest" 
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                const modal = bootstrap.Modal.getInstance(document.getElementById("editUserModal"));
                if (modal) {
                    modal.hide();
                }

                window.location.href = data.redirect_url;
            } else {
                alert("Error: " + (data.error || "Something went wrong"));
            }
        })
        .catch(error => console.error("Error:", error));
    });
});
</script>
