<div
  class="modal fade"
  id="editUserModal"
  tabindex="-1"
  aria-labelledby="editUserModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div
      class="modal-content modal-bg"
    >
      <div class="modal-header border-0">
        <h5
          class="modal-title w-100 text-center fw-bold modal-title-custom"
          id="editUserModalLabel"
        >
          Edit User
        </h5>
      </div>
      <div class="modal-body text-start">
        <p class="mb-4 modal-subtitle-custom">
          Then a short notification message goes here with action buttons below.
        </p>
        <form method="POST" id="editUserForm" action="{% url 'update_user' user.curp %}">
          {% csrf_token %}
          
          <div class="mb-3">
              <label for="curp" class="form-label">CURP</label>
              <input type="text" class="form-control" id="curp" name="curp" value="{{ form.curp.value }}" readonly required>
          </div>
          <br>
      
          <div class="mb-3">
              <label for="firstName" class="form-label">First Name</label>
              <input type="text" class="form-control" id="firstName" name="first_name" value="{{ form.first_name.value }}" required>
          </div>
          <br>
          <div class="mb-3">
              <label for="lastName" class="form-label">Last Name</label>
              <input type="text" class="form-control" id="lastName" name="last_name" value="{{ form.last_name.value }}" required>
          </div>
          <br>
          <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" name="email" value="{{ form.email.value }}" readonly required>
          </div>
          <br>
          <div class="d-flex justify-content-center gap-2 mt-4">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <br><br>
              <button type="submit" class="btn btn-primary">Save</button>
          </div>
      </form>      
      </div>
    </div>
  </div>
</div>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll(".edit-user-btn").forEach(button => {
        button.addEventListener("click", function () {
            const curp = this.getAttribute("data-user-id");

            if (!curp) {
                alert("Invalid user CURP: " + curp);
                return;
            }

            const firstName = this.getAttribute("data-first-name");
            const lastName = this.getAttribute("data-last-name");
            const email = this.getAttribute("data-email");

            document.getElementById("editUserForm").action = `/manage/${curp}/`;
            document.getElementById("curp").value = curp;
            document.getElementById("firstName").value = firstName;
            document.getElementById("lastName").value = lastName;
            document.getElementById("email").value = email;
        });
    });
});

</script>
