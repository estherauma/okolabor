{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% translate "passwordResetConfirmConfirm"%}</title>
    <link rel="stylesheet" href="{% static 'assets/resetpassword/resetpassword.css' %}">
</head>
<body class="background">
    <div class="form-container light-green round-border">
        <h2 style="color: white;">{% translate "passwordResetConfirmEnterNewPassword"%}</h2>
        
        {% if validlink %}
          <form method="POST">
              {% csrf_token %}
              {{ form.as_p }}
              <button type="submit" class="login100-form-btn btn-green">
                  {% translate "passwordResetConfirmChangePassword" %}
              </button>
          </form>
        {% else %}
          <p style="color: white;">
              {% translate "passwordResetConfirmInvalidLink" %}
          </p>
        {% endif %}
    </div>
</body>
</html>
