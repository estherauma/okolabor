<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Link Sent</title>
    <style>
    
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f3f4f6;
            color: #333;
        }

        
        .message-container {
            background-color: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        
        h2 {
            margin-bottom: 1rem;
            color: #4CAF50;
        }

        
        p {
            font-size: 1rem;
            line-height: 1.5;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="message-container">
        <h2>Password Reset Link Sent</h2>
        <p>We have sent an email with instructions for resetting your password.</p>
    </div>
</body>
</html>
