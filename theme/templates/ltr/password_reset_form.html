{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link href="{% static 'assets/plugins/single-page/css/main.css' %}" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="{% static 'assets/resetpassword/resetpassword.css' %}">
    
</head>
<body class="background">
    <div class="container-login100 container-display">
        <div class="p-0 light-green form-container form-styling">
            <div class="login100-form-title logo-padding">
                <img src="{% static 'assets/images/login/logo.svg' %}" alt="Okolabor Logo" />
            </div>
            <h2 style="color: white;">Reset Your Password</h2>
            <form method="POST">
                {% csrf_token %}
                <!-- {{ form.as_p }} -->
                <div class="input100 login-fields">
                    <input type="email" name="{{ form.email.name }}" id="{{ form.email.id_for_label }}"
                     placeholder="Email" class="login-input">                             
                </div>
                <button class="login100-form-btn btn-green" type="submit">Send Reset Link</button>
            </form>
        </div>
    </div>
</body>
</html>
